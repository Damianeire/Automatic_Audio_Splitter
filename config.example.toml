# Copy to ~/.config/trad-split/config.toml. Every key is optional.

# Where session folders go. Default: next to each memo.
# output = "~/Obsidian/Trad Tunes/Sessions"

# Obsidian vault root, so note links are vault-relative.
# vault = "~/Obsidian/Trad Tunes"

# Outputs
audio = true        # export audio files
sets_only = false   # true = skip chat files
reaper = true       # Reaper project + regions CSV
obsidian = false    # session note
plot = false        # score plot PNG
reencode = false    # AAC 192k instead of stream copy

# Detection
min_set = 40.0          # seconds; shorter "sets" become chat
min_chat = 4.0          # seconds; shorter gaps become part of the set
pad_start = 1.5         # seconds kept before each set
pad_end = 3.5           # seconds kept after each set, keeps the applause
switch_penalty = 12.0   # higher = fewer, longer segments
bias = 0.0              # positive favours music, negative favours chat
# Exporting named tunes from a session note (--export-tunes)
# tunes_folder = "Sound Files"   # vault-relative or absolute; default: Obsidian's attachment folder
tune_format = "mp3"              # mp3 or m4a

# Tune changes within sets
tunes = true            # mark where tunes change (chapters, note sections, Reaper markers)
min_tune = 60.0         # seconds; shortest tune
tune_sensitivity = 1.0  # higher marks more changes, lower fewer
# device = "auto"       # auto, cpu, mps, cuda
